<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Coin Base -->
  <circle cx="256" cy="256" r="240" fill="url(#goldGrad)" stroke="#451a03" stroke-width="12" filter="url(#glow)" />
  
  <!-- Outer Beveled Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-dasharray="18 12" />
  
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="184" fill="#1e0f07" stroke="#f59e0b" stroke-width="6" opacity="0.9" />

  <!-- XN Text & Crypto Symbol -->
  <text x="256" y="290" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="url(#goldGrad)" text-anchor="middle" stroke="#451a03" stroke-width="4" letter-spacing="-2">XN</text>
  
  <!-- $NXB Badge -->
  <rect x="156" y="330" width="200" height="48" rx="24" fill="url(#goldGrad)" stroke="#451a03" stroke-width="4" />
  <text x="256" y="363" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#1e0f07" text-anchor="middle">$NXB</text>
  
  <!-- Sparkles -->
  <path d="M 140 130 L 148 110 L 156 130 L 176 138 L 156 146 L 148 166 L 140 146 L 120 138 Z" fill="#fef08a" />
  <path d="M 370 150 L 375 136 L 380 150 L 394 155 L 380 160 L 375 174 L 370 160 L 356 155 Z" fill="#fef08a" />
</svg>
